name: commerceguard
services:
  db:
    image: postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    environment:
      POSTGRES_DB: commerceguard
      POSTGRES_USER: cg_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
    secrets: [owner_password]
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cg_owner -d commerceguard"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    shm_size: 128mb
    mem_limit: 512m
    networks: [backend]
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  init:
    image: commerceguard:local
    build: {context: .., dockerfile: deploy/Dockerfile, target: web}
    command: [init]
    environment: &env
      COMMERCEGUARD_ORIGIN: ${COMMERCEGUARD_ORIGIN:-http://127.0.0.1:8765}
      COMMERCEGUARD_MERCHANT: ${COMMERCEGUARD_MERCHANT:-M01}
    secrets: [owner_password, web_password, operator_password]
    depends_on:
      db: {condition: service_healthy}
    volumes: [raw:/var/lib/commerceguard]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *logs
  web:
    image: commerceguard:local
    build: {context: .., dockerfile: deploy/Dockerfile, target: web}
    environment: *env
    secrets: [web_password]
    depends_on:
      init: {condition: service_completed_successfully}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: [CMD, python, /app/deploy/entrypoint.py, health]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logs
  proxy:
    image: commerceguard-proxy:local
    build: {context: .., dockerfile: deploy/ProxyDockerfile}
    environment: *env
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider --header="Host: $${COMMERCEGUARD_ORIGIN#*://}" http://127.0.0.1:8081/readyz']
      interval: 3s
      timeout: 5s
      retries: 20
    user: "10001:10001"
    ports: ["127.0.0.1:${COMMERCEGUARD_PORT:-8765}:8081"]
    networks: [backend, edge]
    depends_on:
      web: {condition: service_healthy}
    read_only: true
    tmpfs: ["/data:size=16m,mode=1777", "/config:size=16m,mode=1777", "/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    logging: *logs
  tools:
    image: commerceguard-tools:local
    build: {context: .., dockerfile: deploy/Dockerfile, target: full}
    profiles: [tools]
    environment:
      <<: *env
      TMPDIR: /var/lib/commerceguard/tmp
    secrets: [owner_password]
    volumes: [raw:/var/lib/commerceguard]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    logging: *logs
volumes:
  database:
  raw:
secrets:
  owner_password:
    file: ${COMMERCEGUARD_SECRETS_DIR:-../workspace/deployment}/owner_password
  web_password:
    file: ${COMMERCEGUARD_SECRETS_DIR:-../workspace/deployment}/web_password
  operator_password:
    file: ${COMMERCEGUARD_SECRETS_DIR:-../workspace/deployment}/operator_password

networks:
  backend:
    internal: true
  edge: {}
