commerceguard_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('CG_PGHOST') }}"
      port: "{{ env_var('CG_PGPORT', '5432') | int }}"
      user: "{{ env_var('CG_PGUSER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_CG_PASSWORD', '') }}"
      dbname: commerceguard
      schema: commerceguard_mart
      threads: 2
      connect_timeout: 5
      retries: 0
